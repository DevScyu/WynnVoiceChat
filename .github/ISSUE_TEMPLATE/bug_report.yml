name: Bug report
description: Something in the mod or relay does not work as described
labels: ["bug"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Mod (client)
        - Relay (server)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Join world...
        2. Run /wynnvoicechat ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behaviour
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: WynnVoiceChat, Simple Voice Chat, Fabric Loader and Minecraft versions
      placeholder: e.g. WynnVoiceChat 0.1.0, SVC 2.6.3, Fabric Loader 0.18.4, Minecraft 1.21.11
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log excerpt
      description: Relevant lines from `logs/latest.log`, with anything private removed
      render: text
