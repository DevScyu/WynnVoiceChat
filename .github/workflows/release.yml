name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  modrinth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :mod:build -Pversion=${GITHUB_REF_NAME#v} -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64
      - uses: Kira-NT/mc-publish@v3
        with:
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: mod/build/libs/wynnvoicechat-*.jar
          name: WynnVoiceChat ${{ github.ref_name }}
          version: ${{ github.ref_name }}
          game-versions: 1.21.11
          loaders: fabric
          java: 21
